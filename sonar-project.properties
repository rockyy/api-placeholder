##############################################
# SONARQUBE PROJECT METADATA
##############################################
sonar.projectKey=iop-common-insurance-bff
sonar.projectName=iop-common-insurance-bff

# Version dynamically injected by Jenkins (.env)
sonar.projectVersion=${sonarQubeProjectVersion}

##############################################
# SOURCE DIRECTORIES
##############################################
sonar.sources=src/main/java
sonar.tests=src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

##############################################
# JAVA COMPILATION PATHS (CRITICAL)
##############################################
# Maven builds always place class files here
sonar.java.binaries=target/classes
##############################################
# TEST & COVERAGE CONFIGURATION
##############################################
# JaCoCo XML coverage report generated during the Maven test phase
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Surefire test execution results (separate from coverage)
sonar.junit.reportPaths=target/surefire-reports

##############################################
# EXCLUSIONS (same scope as POM jacoco.exclusions)
##############################################
sonar.exclusions=**/wsdl/**,**/commons/**,**/feign/**,**/mapper/**,**/vo/**,**/model/**,**/*Application.*

sonar.coverage.exclusions=**/wsdl/**,**/commons/**,**/feign/**,**/mapper/**,**/vo/**,**/model/**,**/*Application.*

sonar.test.inclusions=src/test/java/**/*.java
##############################################
# LOG LEVELS
##############################################
sonar.log.level=INFO

##############################################
# SCM (GIT)
##############################################
sonar.scm.provider=git

##############################################
# BRANCH ANALYSIS
##############################################
# Jenkins sets sonarQubeBranchName in .env
sonar.branch.name=${sonarQubeBranchName}

##############################################
# REPORT & QUALITY GATE
##############################################
sonar.qualitygate.wait=true

##############################################
# Maven Project Type
##############################################
sonar.projectBaseDir=.

##############################################
# Optional: disable file system scanning for speed
##############################################
sonar.scanAllFiles=true
